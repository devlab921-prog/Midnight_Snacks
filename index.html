<!doctype html>
<html lang="es">
  <head>

    <!-- Charset -->
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/cloud-moon-fill.svg"
    />

    <!-- Título -->
    <title>
      Midnight Snacks | Delivery Nocturno en Chimbote
    </title>

    <!-- SEO -->
    <meta
      name="description"
      content="Delivery nocturno de hamburguesas, pizzas y snacks en Chimbote y Nuevo Chimbote. Pide por WhatsApp y recibe tu comida caliente hasta la madrugada."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="delivery nocturno, hamburguesas, pizza, comida rápida, Chimbote, Nuevo Chimbote, Midnight Snacks"
    />

    <!-- Autor -->
    <meta
      name="author"
      content="Midnight Snacks"
    />

    <!-- Theme color -->
    <meta
      name="theme-color"
      content="#000000"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Midnight Snacks"
    />

    <meta
      property="og:description"
      content="La cocina nocturna que nunca duerme."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="/preview.png"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
